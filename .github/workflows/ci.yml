name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".editorconfig"
      - ".gitignore"
      - ".claude/**"
      - ".remember/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".editorconfig"
      - ".gitignore"
      - ".claude/**"
      - ".remember/**"

permissions:
  contents: read

# Ordered cheapest → most expensive: lint gates unit tests, unit tests gate
# integration tests, so a failure skips the pricier stages.
jobs:
  lint:
    runs-on: ubuntu-latest
    # nilaway's whole-repo analysis started getting OOM-killed ("signal:
    # killed") on the 16 GB runner as the repo grew. A soft memory limit
    # plus a more aggressive GC keeps its RSS under the kernel OOM
    # threshold — slower, but it completes.
    env:
      GOMEMLIMIT: 12GiB
      GOGC: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: extractions/setup-just@v3
      - run: just lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: extractions/setup-just@v3
      - run: just test

  integration:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: extractions/setup-just@v3
      # ubuntu-latest ships a working Docker daemon; testcontainers provisions
      # the real Postgres/Redis/Mongo/ClickHouse/OpenSearch servers per package.
      - run: just test-integration
